<form id="language-form" class="card" hx-patch="/settings/language" hx-target="#language-form" hx-swap="outerHTML">
  <label for="language">{{ t('settings.language') }}</label>
  <select id="language" name="language">
    <option value="fr" {% if user.language == 'fr' %}selected{% endif %}>{{ t('settings.language_fr') }}</option>
    <option value="en" {% if user.language == 'en' %}selected{% endif %}>{{ t('settings.language_en') }}</option>
  </select>
  <button type="submit">{{ t('settings.save') }}</button>
</form>
